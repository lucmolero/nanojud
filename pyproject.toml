[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanojud"
version = "0.5.2"
description = "NanoJud: toolkit Python para extração responsável, normalização e exportação de dados públicos judiciais do eSAJ/TJSP, DataJud/CNJ e DJEN."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
dependencies = [
  "requests>=2.28",
  "beautifulsoup4>=4.11",
  "typing_extensions>=4.9"
]
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Luciano Molero"}
]
keywords = ["esaj", "tjsp", "datajud", "djen", "mcp", "agentes", "juridico", "legaltech", "lawtech", "processo"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Legal Industry",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Natural Language :: Portuguese (Brazilian)",
  "Operating System :: OS Independent",
  "Typing :: Typed",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Internet :: WWW/HTTP",
]

[tool.setuptools]
packages = {find = {where = ["src"], include = ["nanojud*"]}}

[tool.setuptools.package-data]
nanojud = ["py.typed"]

[project.optional-dependencies]
dev = [
  "build>=1.0",
  "coverage>=7.0",
  "mkdocs-material>=9.5",
  "mypy>=1.10",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
  "pytest>=7.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "setuptools>=83.0.0",
  "twine>=5.0",
  "wheel>=0.42",
]
mcp = [
  "mcp>=1.0,<2",
  "pypdf>=5,<7",
]
pdf = [
  "pypdf>=5,<7",
]

[project.urls]
Homepage = "https://lucmolero.github.io/nanojud/"
Source = "https://github.com/lucmolero/nanojud"
Documentation = "https://lucmolero.github.io/nanojud/"
Issues = "https://github.com/lucmolero/nanojud/issues"
Changelog = "https://github.com/lucmolero/nanojud/blob/main/CHANGELOG.md"
Release = "https://github.com/lucmolero/nanojud/releases"
LinkedIn = "https://www.linkedin.com/in/luciano-molero/"
PyPI = "https://pypi.org/project/nanojud/"

[project.scripts]
nanojud = "nanojud.cli:main"
nanojud-mcp = "nanojud.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
markers = [
  "live: testes opcionais que consultam fontes externas reais e ficam desativados por padrão"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
source = ["nanojud"]
omit = ["src/nanojud/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "nanojud.esaj"
ignore_errors = true
