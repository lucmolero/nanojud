name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade packaging tooling
        run: python -m pip install --upgrade pip "setuptools>=83.0.0" wheel

      - name: Install package
        run: python -m pip install -e ".[dev,mcp]"

      - name: Run tests
        run: python -m pytest --cov

      - name: Run lint
        run: python -m ruff check src tests

      - name: Check formatting
        run: python -m ruff format --check src tests

      - name: Type check
        run: python -m mypy src

      - name: Check MCP server import
        run: |
          python - <<'PY'
          from nanojud.mcp_server import create_server

          server = create_server()
          print(type(server).__name__)
          PY

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Audit dependencies
        run: python -m pip_audit --skip-editable
