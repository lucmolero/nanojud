name: Live smoke

# Consulta as fontes reais (eSAJ, DataJud, DJEN) para detectar mudanças que os testes
# offline não pegam. Não bloqueia merge; falha aqui significa que uma fonte mudou.
on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Live smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run live tests
        env:
          NANOJUD_RUN_LIVE: "1"
        run: python -m pytest -m live --no-cov
