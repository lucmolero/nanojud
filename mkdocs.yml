site_name: NanoJud
site_description: "NanoJud: dados judiciais públicos para agentes de IA, advogados e pesquisa jurídica."
site_url: https://lucmolero.github.io/nanojud/
repo_url: https://github.com/lucmolero/nanojud
repo_name: lucmolero/nanojud
edit_uri: edit/main/docs/
theme:
  name: material
  language: pt-BR
  logo: assets/nanojud-icon.svg
  favicon: assets/nanojud-icon.svg
  palette:
    primary: blue grey
    accent: teal
  features:
    - navigation.sections
    - navigation.tabs
    - content.code.copy
    - content.action.edit
    - search.suggest
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
extra_css:
  - stylesheets/landing.css
nav:
  - Início: index.md
  - Quickstart: quickstart.md
  - Instalação Com IA: instalacao-com-ia.md
  - Para Advogados: para-advogados.md
  - Demonstração Pública: demonstracao-publica.md
  - Aprendizados MCP: aprendizados-mcp.md
  - Exemplos Seguros: exemplos-seguros.md
  - Fontes: fontes.md
  - Extração Agregada: extraction.md
  - MCP Local: mcp-local.md
  - PyPI e MCP: pypi.md
  - Cliente Configurável: client.md
  - CLI: cli.md
  - API Reference: api-reference.md
  - Contratos: contracts.md
  - Erros: errors.md
  - Arquitetura: architecture.md
  - Metodologia: metodologia.md
  - Reprodutibilidade: reprodutibilidade.md
  - LGPD: lgpd.md
  - Modelo de Ameaças: threat-model.md
  - Fixtures: fixtures.md
  - Validação Real: validacao-real.md
  - Uso Responsável: uso-responsavel.md
  - Governança: governanca.md
  - Release Notes:
      - v0.5.2: release-notes-v0.5.2.md
      - v0.5.1: release-notes-v0.5.1.md
      - v0.5.0: release-notes-v0.5.0.md
      - v0.4.0: release-notes-v0.4.0.md
      - v0.3.8: release-notes-v0.3.8.md
      - v0.3.7: release-notes-v0.3.7.md
      - v0.3.6: release-notes-v0.3.6.md
      - v0.3.5: release-notes-v0.3.5.md
      - v0.3.4: release-notes-v0.3.4.md
      - v0.3.3: release-notes-v0.3.3.md
